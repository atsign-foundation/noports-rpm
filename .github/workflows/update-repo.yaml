name: Update RPM Metadata
on:
  workflow_dispatch:
  repository_dispatch:
    types: [new-release]

permissions: # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  rebuild-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push metadata updates to this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d > private.key
          gpg --import private.key
          rm private.key

      - name: Download Release Packages
        env:
          # Use the local, short-lived token instead of a PAT
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo atsign-foundation/noports \
            --pattern "*.rpm" --dir incoming/

      - name: Organize RPMs
        working-directory: ./docs
        run: |
          sudo apt-get install -y createrepo-c
          # Define supported architectures
          ARCHS=("aarch64" "armv7hl" "riscv64" "x86_64")
          # Move RPMs into architecture-specific folders
          # Then run createrepo on each arch
          # Then sign metadata
          for ARCH in "${ARCHS[@]}"; do
            mkdir -p ${ARCH}
            mv ../incoming/*${ARCH}.rpm ${ARCH}/ || true
            # Prune older packages, keeping only the 4 most recent
            # ls -v sorts by version, head -n -4 selects all but the last 4
            ls -v ${ARCH}/noports-*.${ARCH}.rpm 2>/dev/null | head -n -4 | xargs -r rm
            createrepo_c --update ${ARCH}
            gpg --detach-sign --armor --batch --yes "${ARCH}/repodata/repomd.xml"
          done

      - name: Commit and Push
        run: |
          git config user.name "Atsign Robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.
          git commit -m "Update repository metadata - gha${{github.run_number}}"
          git push origin trunk
